services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB: diagramas con autoria embebida, sesiones continuas, bitacora
  # grupal y chat publico (2do Parcial). PostgreSQL sigue guardando users y
  # attachments (persistencia poliglota). Cache de WiredTiger limitada para
  # convivir con el resto de la pila en una instancia de 1 GB de RAM.
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SYNCHRONIZE: "true"
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/case_tool}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      AI_PROVIDER: ${AI_PROVIDER:-hybrid}
      AI_HYBRID_ORDER: ${AI_HYBRID_ORDER:-cloud-first}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-20000}
      OLLAMA_FALLBACK_TIMEOUT_MS: ${OLLAMA_FALLBACK_TIMEOUT_MS:-60000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-moderador-uml}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-moondream}
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  db_data:
  mongo_data:
