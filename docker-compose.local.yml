# Plan B: pila completa corriendo en TU laptop, sin depender de AWS ni
# del dominio/certificado real. Usar junto con docker-compose.prod.yml:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml --env-file .env.production up -d --build
#
# Reemplaza el nginx.conf de produccion (que exige el certificado real de
# Let's Encrypt) por una version simple en HTTP puro, y hace que el
# backend use un Ollama local (Plan B sin internet) en vez de Gemini.
# No modifica nada de lo que corre en el servidor real de AWS.
services:
  backend:
    environment:
      # Motor hibrido: Gemini primero y Ollama local como respaldo automatico
      # cuando no hay internet. Para mostrar Ollama en la demo:
      #   AI_HYBRID_ORDER=local-first en .env.production (o en la terminal).
      # host.docker.internal apunta al host Windows desde dentro del
      # contenedor, donde corre "ollama serve" en el puerto 11434.
      AI_PROVIDER: hybrid
      AI_HYBRID_ORDER: ${AI_HYBRID_ORDER:-cloud-first}
      OLLAMA_BASE_URL: http://host.docker.internal:11434

  frontend:
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
