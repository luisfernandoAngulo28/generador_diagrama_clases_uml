# Plan B: pila completa corriendo en TU laptop, sin depender de AWS ni
# del dominio/certificado real. Usar junto con docker-compose.prod.yml:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml --env-file .env.production up -d --build
#
# Reemplaza el nginx.conf de produccion (que exige el certificado real de
# Let's Encrypt) por una version simple en HTTP puro, y hace que el
# chat del backend use primero el Ollama local de esta laptop.
# No modifica nada de lo que corre en el servidor real de AWS.
services:
  backend:
    environment:
      # Motor hibrido, IA local primero: el chat lo responde Ollama en esta
      # laptop. Gemini solo entra para leer fotos de diagramas (imagen -> texto),
      # para un proyecto completo (demasiado para el modelo de 1,5B en CPU:
      # medido 46 s y resultado pobre el 11/11/2026) y como respaldo si Ollama
      # no responde en OLLAMA_TIMEOUT_MS. El chat muestra en cada respuesta
      # cual de esos casos fue.
      # host.docker.internal apunta al host Windows desde dentro del
      # contenedor, donde corre "ollama serve" en el puerto 11434.
      AI_PROVIDER: hybrid
      AI_HYBRID_ORDER: ${AI_HYBRID_ORDER:-local-first}
      # El primer pedido carga el modelo en memoria (~45 s en CPU).
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-60000}
      OLLAMA_BASE_URL: http://host.docker.internal:11434

  frontend:
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
